# Application properties for development (H2 DB)

# Server configuration
server.port=8080

# Datasource (H2 in‑memory; compatible with MySQL mode for easy migration)
spring.datasource.url=jdbc:h2:mem:registrationdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT secret – replace before production
jwt.secret=ChangeThisSecretToAStrongRandomValue

# Swagger UI paths
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
